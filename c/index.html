<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beverage Union — Tasting</title>
<link rel="stylesheet" href="../assets/css/brand.css">
<link rel="stylesheet" href="../assets/css/shared.css">
<style>
body{background:var(--paper);}

/* ---------- hero ---------- */
.hero{
  position:relative;
  height:clamp(460px,74vh,760px);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;isolation:isolate;
}
.hero-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0;}
/* soft wash so the type always reads, whatever the gradient is doing */
.hero::before{
  content:"";position:absolute;inset:0;z-index:1;
  background:radial-gradient(78% 62% at 50% 46%, rgba(243,234,220,.60), rgba(243,234,220,.12) 62%, transparent 100%);
}
/* blend into the page — no hard edge regardless of shader colours */
.hero::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:46%;z-index:2;
  background:linear-gradient(180deg, rgba(243,234,220,0) 0%, rgba(243,234,220,.72) 52%, var(--paper) 100%);
}
.hero-inner{position:relative;z-index:3;text-align:center;padding:0 clamp(20px,6vw,40px);max-width:820px;}
.hero-marks{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:26px;}
.hero-marks img{height:30px;width:auto;}
.hero-marks .sep{width:1px;height:24px;background:var(--line-strong);}
.hero .eyebrow{color:var(--umber);}
.hero h1{font-size:clamp(38px,8vw,80px);color:var(--ink);margin:0;}
.hero .rule{width:52px;height:1px;background:var(--camel-deep);opacity:.6;margin:24px auto;}
.hero .desc{
  font-size:clamp(14px,2.3vw,17px);line-height:1.7;color:var(--umber);
  max-width:520px;margin:0 auto;
}

#stateMsg{text-align:center;color:var(--ink-soft);font-size:14px;padding:120px 20px;}

/* ---------- rows ---------- */
.rows-wrap{max-width:1280px;margin:0 auto;padding:clamp(10px,3vh,26px) 0 30px;}
.cat-block{margin-bottom:clamp(30px,5vh,52px);}
.cat-label{
  font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;
  color:var(--camel-deep);margin:0 0 14px;padding-left:clamp(18px,5vw,34px);
}
.marquee{
  position:relative;overflow:hidden;cursor:grab;touch-action:pan-y;user-select:none;padding:12px 0 6px;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);
          mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);
}
.marquee.grabbing{cursor:grabbing;}
.mq-track{display:flex;will-change:transform;}
.mq-item{
  flex:0 0 auto;width:clamp(140px,32vw,196px);margin-right:clamp(18px,3.4vw,34px);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  cursor:pointer;transition:transform .45s cubic-bezier(.2,.85,.3,1);
}
.mq-item .shot{
  width:100%;height:clamp(210px,36vh,320px);
  display:flex;align-items:center;justify-content:center;
}
.mq-item img{
  max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;
  pointer-events:none;-webkit-user-drag:none;
  filter:drop-shadow(0 18px 26px rgba(51,40,31,.22));
  transition:filter .45s ease;
}
.mq-item .mq-name{font-size:13.5px;font-weight:500;color:var(--ink);margin:14px 0 0;text-align:center;pointer-events:none;}
.mq-item .mq-sub{font-size:11.5px;color:var(--ink-faint);margin:3px 0 0;text-align:center;pointer-events:none;}
.mq-item:hover{transform:translateY(-8px);}
.mq-item:hover img{filter:drop-shadow(0 26px 34px rgba(51,40,31,.3));}

footer{text-align:center;margin:56px 0 60px;}
footer img{width:96px;margin:0 auto;opacity:.4;}
</style>
</head>
<body>

<div id="stateMsg">Preparing the tasting&#8230;</div>

<div id="content" style="display:none;">
  <header class="hero">
    <canvas class="hero-canvas" id="heroCanvas"></canvas>
    <div class="hero-inner">
      <div class="hero-marks" id="logoRow">
        <img src="../assets/logos/bu-mark-dark.svg" alt="Beverage Union">
      </div>
      <p class="eyebrow">A Beverage Union tasting</p>
      <h1 class="h-display" id="catTitle"></h1>
      <div class="rule"></div>
      <p class="desc" id="catDesc"></p>
    </div>
  </header>

  <div class="rows-wrap"><div id="rows"></div></div>
  <footer><img src="../assets/logos/bu-wordmark-dark.svg" alt="Beverage Union"></footer>
</div>

<script src="../assets/vendor/three.min.js"></script>
<script src="../assets/js/supabase-client.js"></script>
<script src="../assets/js/backgrounds.js"></script>
<script src="../assets/js/drink-detail.js"></script>
<script>
async function boot(){
  const id = new URLSearchParams(location.search).get('id');
  const stateMsg = document.getElementById('stateMsg');
  if(!id){ stateMsg.textContent = 'This link is missing a menu id.'; return; }

  try{
    const catalogue = await fetchCatalogue(id);
    if(!catalogue){ stateMsg.textContent = "This tasting couldn't be found."; return; }
    const drinks = await fetchDrinksByIds(catalogue.drink_ids);
    if(drinks.length === 0){ stateMsg.textContent = "This tasting doesn't have any drinks yet."; return; }

    document.getElementById('catTitle').textContent = catalogue.name;
    const descEl = document.getElementById('catDesc');
    if(catalogue.description) descEl.textContent = catalogue.description;
    else descEl.style.display = 'none';

    if(catalogue.client_logo_url){
      const row = document.getElementById('logoRow');
      const sep = document.createElement('div'); sep.className='sep';
      const img = document.createElement('img'); img.src = catalogue.client_logo_url; img.alt = catalogue.name;
      row.appendChild(sep); row.appendChild(img);
    }

    stateMsg.style.display='none';
    document.getElementById('content').style.display='block';

    buStartBackground(document.getElementById('heroCanvas'),
                      catalogue.background_style || 'halo',
                      catalogue.bg_colors);

    buildRows(drinks, catalogue.categories || []);
  } catch(err){
    stateMsg.textContent = err.message || 'Something went wrong loading this tasting.';
  }
}

function buildRows(drinks, order){
  const rows = document.getElementById('rows');
  const groups = new Map();
  drinks.forEach(d=>{
    const key = d.category || 'The selection';
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(d);
  });
  const keys = [];
  order.forEach(k=>{ if(groups.has(k)) keys.push(k); });
  groups.forEach((_,k)=>{ if(!keys.includes(k)) keys.push(k); });

  keys.forEach(key=>{
    const list = groups.get(key);
    const block = document.createElement('div');
    block.className='cat-block';
    const label = document.createElement('p');
    label.className='cat-label'; label.textContent = key;
    block.appendChild(label);
    const mq = document.createElement('div'); mq.className='marquee';
    const track = document.createElement('div'); track.className='mq-track';
    mq.appendChild(track); block.appendChild(mq); rows.appendChild(block);
    startMarquee(mq, track, list);
  });
}

function startMarquee(wrap, track, list){
  let itemW = 0, setW = 0, pos = 0, target = 0;
  let dragging = false, moved = false, startX = 0, lastX = 0, lastT = 0, vel = 0;
  const DRIFT = 0.02, FRICTION = 0.94;

  function fill(){
    track.innerHTML = '';
    const probe = document.createElement('div');
    probe.className='mq-item'; track.appendChild(probe);
    const cs = getComputedStyle(probe);
    itemW = probe.getBoundingClientRect().width + parseFloat(cs.marginRight || 0);
    probe.remove();
    if(!itemW || !isFinite(itemW)) itemW = 210;

    const need = Math.max(2, Math.ceil((wrap.clientWidth*2)/(itemW*list.length)) + 1);
    for(let c=0;c<need;c++){
      list.forEach(d=>{
        const item = document.createElement('div');
        item.className='mq-item';
        const shot = document.createElement('div'); shot.className='shot';
        const img = document.createElement('img');
        img.src = d.image_url; img.alt = d.name; img.draggable=false; img.loading='lazy';
        shot.appendChild(img);
        const nm = document.createElement('p'); nm.className='mq-name'; nm.textContent = d.name;
        item.appendChild(shot); item.appendChild(nm);
        if(d.type){
          const sub = document.createElement('p'); sub.className='mq-sub'; sub.textContent = d.type;
          item.appendChild(sub);
        }
        item.addEventListener('click', ()=>{ if(!moved) buOpenDrink(d); });
        track.appendChild(item);
      });
    }
    setW = itemW * list.length;
    pos = setW; target = setW;
  }
  fill();

  let prevT = null;
  function tick(t){
    if(prevT === null) prevT = t;
    let dt = t - prevT; prevT = t;
    if(dt > 60) dt = 60;
    if(dragging){ pos += (target - pos) * 0.28; }
    else if(Math.abs(vel) > DRIFT){ pos += vel*dt; vel *= Math.pow(FRICTION, dt/16.67); target = pos; }
    else { vel = 0; pos += DRIFT*dt; target = pos; }
    if(setW > 0){
      while(pos >= setW*2){ pos -= setW; target -= setW; }
      while(pos < setW){ pos += setW; target += setW; }
    }
    track.style.transform = 'translate3d(' + (-pos).toFixed(2) + 'px,0,0)';
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  wrap.addEventListener('pointerdown', e=>{
    dragging = true; moved = false;
    startX = lastX = e.clientX; lastT = performance.now(); vel = 0; target = pos;
    wrap.classList.add('grabbing');
  });
  function onMove(e){
    if(!dragging) return;
    const dx = e.clientX - lastX;
    if(Math.abs(e.clientX - startX) > 4) moved = true;
    target -= dx;
    const now = performance.now(), dt = now - lastT;
    if(dt > 0) vel = vel*0.7 + (-dx/dt)*0.3;
    lastX = e.clientX; lastT = now;
  }
  function release(){
    if(!dragging) return;
    dragging = false; wrap.classList.remove('grabbing');
    if(performance.now() - lastT > 90) vel = 0;
    vel = Math.max(-2.6, Math.min(2.6, vel));
    setTimeout(()=>{ moved = false; }, 0);
  }
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', release);
  window.addEventListener('pointercancel', release);

  let rt=null;
  window.addEventListener('resize', ()=>{ clearTimeout(rt); rt=setTimeout(fill,150); });
}

boot();
</script>
</body>
</html>
