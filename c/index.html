<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beverage Union — Tasting</title>
<link rel="stylesheet" href="../assets/css/brand.css">
<style>
body{overflow-x:hidden;}
#bgCanvas{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1;}

.page-wrap{max-width:1100px;margin:0 auto;padding:64px 24px 40px;position:relative;z-index:1;}
.hero{text-align:center;margin-bottom:12px;}
.logo-row{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:24px;}
.logo-row img{height:32px;width:auto;}
.logo-row .divider{width:1px;height:24px;background:var(--line-strong);}
.hero h1{font-size:clamp(34px,6vw,58px);text-shadow:0 4px 30px rgba(0,0,0,0.4);}
.hero p.sub{font-size:15px;color:var(--parchment);opacity:0.75;max-width:460px;margin:14px auto 0;line-height:1.6;}

#stateMsg{text-align:center;color:var(--text-dim);font-size:14px;padding:100px 0;position:relative;z-index:1;}

/* infinite row */
.row-wrap{
  position:relative;z-index:1;margin-top:56px;padding:20px 0 70px;
  cursor:grab;touch-action:pan-y;user-select:none;overflow:hidden;
}
.row-wrap.grabbing{cursor:grabbing;}
.row-track{display:flex;will-change:transform;}
.row-item{
  flex:0 0 220px;height:280px;margin-right:34px;display:flex;align-items:center;justify-content:center;
  transition:transform .3s ease;
}
.row-item img{max-width:88%;max-height:88%;object-fit:contain;filter:drop-shadow(0 20px 26px rgba(0,0,0,0.5));pointer-events:none;-webkit-user-drag:none;}
.row-item:hover{transform:translateY(-6px) scale(1.04);}

footer{text-align:center;margin:20px 0 60px;position:relative;z-index:1;}
footer img{width:100px;margin:0 auto;opacity:0.55;}

/* takeover */
#takeover{
  position:fixed;inset:0;background:rgba(10,8,6,0.88);backdrop-filter:blur(20px);
  display:none;align-items:center;justify-content:center;z-index:50;padding:40px 24px;
}
#takeover.open{display:flex;}
.takeover-inner{
  display:flex;gap:56px;max-width:920px;width:100%;align-items:center;
}
@media(max-width:760px){.takeover-inner{flex-direction:column;gap:28px;}}
.takeover-img{flex:1 1 46%;display:flex;align-items:center;justify-content:center;}
.takeover-img img{max-width:100%;max-height:60vh;object-fit:contain;filter:drop-shadow(0 30px 50px rgba(0,0,0,0.55));}
.takeover-info{flex:1 1 46%;}
.takeover-info .eyebrow{margin-bottom:12px;}
.takeover-info h2{font-family:'General Sans',sans-serif;font-weight:600;font-size:clamp(28px,4vw,42px);margin:0 0 16px;letter-spacing:-0.01em;}
.takeover-info p.desc{font-size:15px;line-height:1.65;color:var(--text-dim);margin:0 0 20px;max-width:420px;}
.takeover-tags{display:flex;gap:8px;flex-wrap:wrap;}
.tk-tag{font-size:11px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;padding:6px 13px;border-radius:999px;border:1px solid var(--line);color:var(--text-dim);}
#closeBtn{
  position:absolute;top:26px;right:28px;width:40px;height:40px;border-radius:50%;
  border:1px solid var(--line-strong);color:var(--parchment);font-size:18px;
  display:flex;align-items:center;justify-content:center;z-index:51;
}
#closeBtn:hover{background:rgba(250,249,247,0.08);}
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>
<div id="stateMsg">Preparing the tasting…</div>

<div id="content" style="display:none;">
  <div class="page-wrap">
    <div class="hero">
      <div class="logo-row" id="logoRow">
        <img src="../assets/logos/bu-mark-light.svg" alt="Beverage Union">
      </div>
      <p class="eyebrow">A Beverage Union tasting</p>
      <h1 class="h-display" id="catTitle"></h1>
      <p class="sub" id="catDesc" style="display:none;"></p>
    </div>

    <div class="row-wrap" id="rowWrap">
      <div class="row-track" id="rowTrack"></div>
    </div>

    <footer><img src="../assets/logos/bu-wordmark-light.svg" alt="Beverage Union"></footer>
  </div>
</div>

<div id="takeover">
  <button id="closeBtn" aria-label="Close">✕</button>
  <div class="takeover-inner">
    <div class="takeover-img"><img id="tkImg" alt=""></div>
    <div class="takeover-info">
      <p class="eyebrow" id="tkType"></p>
      <h2 id="tkName"></h2>
      <p class="desc" id="tkDesc"></p>
      <div class="takeover-tags" id="tkTags"></div>
    </div>
  </div>
</div>

<script src="../assets/js/supabase-client.js"></script>
<script src="../assets/js/textures.js"></script>
<script>
const ITEM_PITCH = 254; // 220 width + 34 margin

async function boot(){
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const stateMsg = document.getElementById('stateMsg');
  if(!id){ stateMsg.textContent = "This link is missing a catalogue id."; return; }

  try{
    const catalogue = await fetchCatalogue(id);
    if(!catalogue){ stateMsg.textContent = "This tasting couldn't be found."; return; }
    const drinks = await fetchDrinksByIds(catalogue.drink_ids);
    if(drinks.length === 0){ stateMsg.textContent = "This tasting doesn't have any drinks yet."; return; }

    document.getElementById('catTitle').textContent = catalogue.name;
    if(catalogue.description){
      const d = document.getElementById('catDesc'); d.textContent = catalogue.description; d.style.display='block';
    }
    if(catalogue.client_logo_url){
      const row = document.getElementById('logoRow');
      const divider = document.createElement('div'); divider.className='divider';
      const img = document.createElement('img'); img.src = catalogue.client_logo_url; img.alt = catalogue.name;
      row.appendChild(divider); row.appendChild(img);
    }

    buStartTexture(document.getElementById('bgCanvas'), catalogue.background_style || 'ember');
    document.getElementById('bgCanvas').style.filter = 'blur(2px)';

    stateMsg.style.display='none';
    document.getElementById('content').style.display='block';
    buildRow(drinks);
  } catch(err){
    stateMsg.textContent = err.message || "Something went wrong loading this tasting.";
  }
}

function buildRow(drinks){
  const track = document.getElementById('rowTrack');
  const wrap = document.getElementById('rowWrap');
  const setWidth = drinks.length * ITEM_PITCH;

  for(let copy=0; copy<3; copy++){
    drinks.forEach(d=>{
      const item = document.createElement('div');
      item.className = 'row-item';
      const img = document.createElement('img');
      img.src = d.image_url; img.alt = d.name; img.draggable = false;
      item.appendChild(img);
      item.addEventListener('click', ()=>{ if(!wasDragging) openTakeover(d); });
      track.appendChild(item);
    });
  }

  let offset = setWidth;
  let dragging = false, startX = 0, startOffset = 0, wasDragging = false, paused = false;
  let lastT = null;
  const SPEED = 0.026; // px per ms

  function tick(t){
    if(lastT === null) lastT = t;
    const dt = t - lastT; lastT = t;
    if(!dragging && !paused){ offset += SPEED * dt; }
    if(offset >= setWidth*2) offset -= setWidth;
    if(offset < 0) offset += setWidth;
    track.style.transform = 'translateX(' + (-offset) + 'px)';
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  wrap.addEventListener('pointerdown', e=>{
    dragging = true; wasDragging = false; startX = e.clientX; startOffset = offset;
    wrap.setPointerCapture(e.pointerId); wrap.classList.add('grabbing');
  });
  wrap.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const dx = e.clientX - startX;
    if(Math.abs(dx) > 6) wasDragging = true;
    offset = startOffset - dx;
  });
  function release(){
    if(!dragging) return;
    dragging = false; wrap.classList.remove('grabbing');
    setTimeout(()=>{ wasDragging = false; }, 50);
  }
  wrap.addEventListener('pointerup', release);
  wrap.addEventListener('pointercancel', release);

  window._buPauseRow = (v)=>{ paused = v; };
}

function openTakeover(d){
  document.getElementById('tkImg').src = d.image_url;
  document.getElementById('tkName').textContent = d.name;
  document.getElementById('tkDesc').textContent = d.description;
  document.getElementById('tkType').textContent = d.bean + ' · ' + d.type;
  const tagsEl = document.getElementById('tkTags');
  tagsEl.innerHTML = '';
  (d.tasting_notes||[]).forEach(t=>{
    const tag = document.createElement('span'); tag.className='tk-tag'; tag.textContent = t;
    tagsEl.appendChild(tag);
  });
  document.getElementById('takeover').classList.add('open');
  if(window._buPauseRow) window._buPauseRow(true);
}
function closeTakeover(){
  document.getElementById('takeover').classList.remove('open');
  if(window._buPauseRow) window._buPauseRow(false);
}
document.getElementById('closeBtn').addEventListener('click', closeTakeover);
document.getElementById('takeover').addEventListener('click', e=>{
  if(e.target.id === 'takeover') closeTakeover();
});
document.addEventListener('keydown', e=>{
  if(e.key === 'Escape') closeTakeover();
});

boot();
</script>
</body>
</html>
