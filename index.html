<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atlas — Beverage Union</title>
<link rel="stylesheet" href="assets/css/brand.css">
<link rel="stylesheet" href="assets/css/shared.css">
<style>
body{overflow-x:hidden;}
.top-nav{display:flex;justify-content:flex-end;padding:18px 22px 0;max-width:1240px;margin:0 auto;}
.top-nav a{font-size:12px;color:var(--text-faint);text-decoration:none;letter-spacing:.04em;}
.top-nav a:hover{color:var(--text-dim);}

.shell{max-width:1240px;margin:0 auto;padding:0 clamp(16px,4vw,30px) 90px;}
.hero{text-align:center;margin:clamp(32px,7vh,60px) 0 clamp(40px,7vh,64px);}
.hero img{width:36px;margin:0 auto 18px;}
.hero h1{font-size:clamp(32px,7vw,60px);}
.hero p.sub{font-size:clamp(13px,2.4vw,15px);color:var(--text-dim);max-width:380px;margin:14px auto 0;line-height:1.6;}

.section-head{margin:0 0 16px;}
.section-head h2{font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;margin:0 0 5px;color:var(--steel);}
.section-head p{font-size:12.5px;color:var(--text-faint);margin:0;}
.rule{border:none;border-top:1px solid var(--line);margin:0 0 22px;}

/* menus */
.cat-scroll{
  display:flex;gap:16px;overflow-x:auto;padding:2px 2px 16px;margin-bottom:clamp(48px,8vh,72px);
  scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;
}
.cat-scroll::-webkit-scrollbar{height:4px;}
.cat-scroll::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:4px;}
.cat-tile{
  position:relative;flex:0 0 auto;width:clamp(220px,64vw,278px);aspect-ratio:16/10;
  border-radius:16px;overflow:hidden;cursor:pointer;scroll-snap-align:start;text-decoration:none;
  transition:transform .45s cubic-bezier(.2,.85,.3,1);isolation:isolate;
}
.cat-tile:hover{transform:translateY(-5px);}
.cat-tile canvas{position:absolute;inset:0;width:100%;height:100%;display:block;transform:scale(1.06);}
.cat-tile .veil{
  position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;
  background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.62) 100%);
}
.cat-tile .t-name{font-size:16px;font-weight:600;margin:0 0 3px;color:#fff;}
.cat-tile .t-count{font-size:11.5px;color:rgba(255,255,255,.8);margin:0;}

/* infinite grid — full bleed, images only */
.ig-band{
  position:relative;width:100vw;left:50%;transform:translateX(-50%);
  height:clamp(420px,72vh,780px);overflow:hidden;cursor:grab;
  touch-action:none;user-select:none;
}
.ig-band.grabbing{cursor:grabbing;}
.ig-layer{position:absolute;inset:0;}
.ig-cell{
  position:absolute;top:0;left:0;will-change:transform;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.ig-cell img{
  max-width:88%;max-height:88%;object-fit:contain;pointer-events:none;
  filter:drop-shadow(0 18px 26px rgba(0,0,0,.5));
  transition:transform .42s cubic-bezier(.2,.85,.3,1);
}
.ig-cell:hover img{transform:scale(1.09);}
.ig-hint{text-align:center;font-size:11.5px;color:var(--text-faint);margin:16px 0 0;letter-spacing:.04em;}
#stateMsg{text-align:center;color:var(--text-dim);font-size:14px;padding:50px 0;}
footer{text-align:center;margin-top:70px;}
footer img{width:96px;margin:0 auto;opacity:.5;}
</style>
</head>
<body>

<div class="top-nav"><a href="admin/">Admin &#8599;</a></div>

<div class="shell">
  <div class="hero">
    <img src="assets/logos/bu-mark-light.svg" alt="Beverage Union">
    <p class="eyebrow">Atlas</p>
    <h1 class="h-display">Every drink,<br>one place.</h1>
    <p class="sub">The full collection, and every menu built from it.</p>
  </div>

  <div id="catSection" style="display:none;">
    <div class="section-head"><h2>Menus</h2><p>Curated selections, ready to share.</p></div>
    <hr class="rule">
    <div class="cat-scroll" id="catScroll"></div>
  </div>

  <div id="gridSection" style="display:none;">
    <div class="section-head"><h2>Everything we offer</h2><p id="gridCount"></p></div>
    <hr class="rule">
    <div class="ig-band" id="igViewport"></div>
    <p class="ig-hint">Drag in any direction &#183; tap a drink to open it</p>
  </div>

  <div id="stateMsg">Loading&#8230;</div>

  <footer><img src="assets/logos/bu-wordmark-light.svg" alt="Beverage Union"></footer>
</div>

<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/backgrounds.js"></script>
<script src="assets/js/infinite-grid.js"></script>
<script src="assets/js/drink-detail.js"></script>
<script>
async function boot(){
  try{
    const [catRes, drinkRes] = await Promise.all([
      fetch(SUPABASE_URL + '/rest/v1/catalogues?is_public=eq.true&select=id,name,drink_ids,background_style,bg_colors&order=created_at.desc', { headers: buHeaders() }),
      fetch(SUPABASE_URL + '/rest/v1/drinks?is_public=eq.true&select=id,name,description,image_url,bean,type,category,tasting_notes&order=created_at.desc', { headers: buHeaders() })
    ]);
    if(!catRes.ok) throw new Error('Could not load menus (' + catRes.status + ')');
    if(!drinkRes.ok) throw new Error('Could not load drinks (' + drinkRes.status + ')');

    const catalogues = await catRes.json();
    const drinks = await drinkRes.json();
    document.getElementById('stateMsg').style.display = 'none';

    if(catalogues.length){
      document.getElementById('catSection').style.display = 'block';
      const scroll = document.getElementById('catScroll');
      catalogues.forEach(c=>{
        const tile = document.createElement('a');
        tile.className = 'cat-tile bu-grain';
        tile.href = 'c/?id=' + c.id;
        const canvas = document.createElement('canvas');
        tile.appendChild(canvas);
        const veil = document.createElement('div');
        veil.className = 'veil';
        veil.innerHTML = '<p class="t-name"></p><p class="t-count"></p>';
        veil.querySelector('.t-name').textContent = c.name;
        veil.querySelector('.t-count').textContent = (c.drink_ids||[]).length + ' drinks';
        tile.appendChild(veil);
        scroll.appendChild(tile);
        buStartBackground(canvas, c.background_style || 'flow', c.bg_colors);
      });
    }

    if(drinks.length){
      document.getElementById('gridSection').style.display = 'block';
      document.getElementById('gridCount').textContent = drinks.length + (drinks.length===1?' drink':' drinks');
      buInfiniteGrid({
        viewport: document.getElementById('igViewport'),
        items: drinks,
        onOpen: buOpenDrink
      });
    }

    if(!catalogues.length && !drinks.length){
      const m = document.getElementById('stateMsg');
      m.style.display = 'block';
      m.textContent = 'Nothing published yet \u2014 turn on "On home" for a drink or menu in the admin panel.';
    }
  } catch(err){
    document.getElementById('stateMsg').textContent = err.message || 'Could not load Atlas.';
  }
}
boot();
</script>
</body>
</html>
